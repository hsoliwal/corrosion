name: M3 original Corrosion Cargo evidence acceptance

on:
  pull_request:
    branches: [master]
    paths:
      - 'org.eclipse.corrosion/src/org/eclipse/corrosion/cargo/core/**'
      - 'org.eclipse.corrosion.tests/src/org/eclipse/corrosion/tests/M3CargoBuildEvidenceTest.java'
      - 'org.eclipse.corrosion.tests/projects/m3-cargo-build-facts-v1.fixture'
      - 'documentation/tools/M3CargoTestReceiptMain.java'
      - '.github/workflows/m3-corrosion-cargo-facts.yml'
  push:
    branches: [master]
    paths:
      - 'org.eclipse.corrosion/src/org/eclipse/corrosion/cargo/core/**'
      - 'org.eclipse.corrosion.tests/src/org/eclipse/corrosion/tests/M3CargoBuildEvidenceTest.java'
      - 'documentation/tools/M3CargoTestReceiptMain.java'
      - '.github/workflows/m3-corrosion-cargo-facts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-corrosion:
    name: Original Cargo/Eclipse source owner (JDK 25)
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0 # v5.1
        with:
          maven-version: 3.9.16
      - name: Install original Rust test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdb xvfb
          rustup default stable
          rustup component add rust-analyzer
          rust-analyzer --version
      - name: Execute original Corrosion Tycho PDE tests without failure-ignore
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a mvn -B -V -e -ntp clean install \
            -Dmaven.test.failure.ignore=false \
            -DskipTests=false \
            -Dtycho.showEclipseLog=true
      - name: Require all four source-owner Cargo cases actually ran
        run: |
          java documentation/tools/M3CargoTestReceiptMain.java \
            org.eclipse.corrosion.tests/target/surefire-reports
      - name: Retain original Corrosion test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: original-corrosion-cargo-jdk25
          path: |
            org.eclipse.corrosion.tests/target/surefire-reports/**
            org.eclipse.corrosion.tests/target/*.log
          if-no-files-found: ignore
          retention-days: 14
